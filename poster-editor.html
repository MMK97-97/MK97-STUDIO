<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#030405"><title>Poster Studio — MK97</title><link rel="stylesheet" href="app.css?v=25"><link rel="stylesheet" href="editor.css?v=25"></head><body class="editor-page"><div class="editor-shell">
<header class="editor-topbar">
<a class="editor-back" href="index.html" aria-label="Back">‹</a>
<div class="editor-title"><input id="projectName" value="MK97 Poster" aria-label="Project name"></div>
<div class="editor-actions"><button id="undoBtn" class="editor-btn">↶</button><button id="redoBtn" class="editor-btn">↷</button><button id="exportBtn" class="editor-btn primary">Export</button></div>
</header>
<main class="editor-main">
<section class="preview-area">
<div class="preview-toolbar">
  <div class="group"><select id="canvasSize"><option value="portrait">4:5</option><option value="square">1:1</option><option value="story">9:16</option></select><button id="fitBtn">Fit</button><button id="gridBtn">Grid</button></div>
  <div class="group"><button id="zoomOut">−</button><button id="zoomLabel">100%</button><button id="zoomIn">＋</button></div>
</div>
<div id="stage" class="stage"><div id="canvasFrame" class="canvas-frame"><canvas id="posterCanvas" width="1080" height="1350"></canvas></div></div>
<div class="preview-status"><span>Tap an object to edit</span><strong id="posterDimensions">1080 × 1350</strong></div>
</section>

<nav class="poster-bottom-tools" aria-label="Poster tools">
  <button class="tool-btn" data-tool="templates"><span>▦</span>Templates</button>
  <button class="tool-btn" data-tool="media"><span>＋</span>Media</button>
  <button class="tool-btn" id="addTextBtn"><span>T</span>Text</button>
  <button class="tool-btn" id="addShapeBtn"><span>◆</span>Shape</button>
  <button class="tool-btn" data-tool="adjust"><span>☼</span>Adjust</button>
  <button class="tool-btn" data-tool="layers"><span>☷</span>Layers</button>
  <button class="tool-btn" id="removeBgBtn"><span>✂</span>Cutout</button>
  <button class="tool-btn" data-tool="canvas"><span>▣</span>Canvas</button>
  <button class="tool-btn primary" id="mobileExport"><span>↓</span>Export</button>
</nav>
</main>

<div id="sheetBackdrop" class="sheet-backdrop"></div>

<section id="assetSheet" class="bottom-sheet" aria-label="Assets">
<div class="sheet-handle"></div><div class="sheet-head"><b>Creative tools</b><button class="sheet-close" data-close>×</button></div>
<div class="sheet-content">
  <div class="sheet-tabs"><button class="sheet-tab active" data-tab="templates">Templates</button><button class="sheet-tab" data-tab="media">Media</button><button class="sheet-tab" data-tab="layers">Layers</button></div>
  <section data-panel="templates"><div class="editor-search"><input id="editorTemplateSearch" placeholder="Search templates..."></div><div id="editorTemplateCount" style="font-size:8px;color:#777;margin-bottom:8px"></div><div id="editorTemplateGrid" class="template-mini-grid"></div></section>
  <section data-panel="media" class="hidden"><div class="asset-grid-editor"><button id="uploadImageBtn" class="asset-action"><span><b>＋</b>Upload image</span></button><button class="asset-action" onclick="location.href='media.html'"><span><b>▣</b>Media browser</span></button><button class="asset-action" onclick="location.href='brand.html'"><span><b>◇</b>Brand kit</span></button><button class="asset-action" id="mediaAddText"><span><b>T</b>Add text</span></button></div><input id="imageInput" type="file" accept="image/*" hidden></section>
  <section data-panel="layers" class="hidden"><div id="layerList" class="layer-list"></div></section>
</div>
</section>

<section id="editSheet" class="bottom-sheet" aria-label="Edit properties">
<div class="sheet-handle"></div><div class="sheet-head"><b id="inspectorTitle">Edit</b><button class="sheet-close" data-close>×</button></div>
<div class="sheet-content"><div id="inspector"></div><div class="sheet-footer"><button id="duplicateBtn" class="small-btn">Duplicate</button><button id="deleteBtn" class="small-btn danger">Delete</button></div></div>
</section>

<div id="quickSelected" class="quick-selected"><button id="quickEdit">Edit</button><button id="quickDuplicate">Duplicate</button><button id="quickDelete" class="danger">Delete</button></div>

</div><script src="templates-data.js?v=25"></script><script src="poster-editor.js?v=25"></script></body></html>
